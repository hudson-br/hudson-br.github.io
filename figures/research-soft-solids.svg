<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 28" fill="none">
  <!-- Stable branch approaching critical point -->
  <line x1="0" y1="14" x2="17" y2="14"
    stroke="#4e87c8" stroke-width="2" stroke-linecap="round"/>
  <!-- Upper bifurcating branch -->
  <path d="M 17 14 C 23 14 26 6 40 5"
    stroke="#4e87c8" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Lower bifurcating branch -->
  <path d="M 17 14 C 23 14 26 22 40 23"
    stroke="#4e87c8" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Critical point -->
  <circle cx="17" cy="14" r="2.8" fill="#4e87c8" fill-opacity="0.28"/>
</svg>
